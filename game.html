<!DOCTYPE html>
<html>
<head>
    <title>Number Guessing Game</title>

    <style>
        body {
            font-family: Arial;
            background: #222;
            color: white;
            text-align: center;
            padding-top: 100px;
        }

        .game {
            background: white;
            color: black;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            padding: 10px;
            width: 200px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="game">
        <h1>Number Guessing Game</h1>

        <p>Guess a number between 1 and 100</p>

        <input type="number" id="guess" placeholder="Enter number">

        <br>

        <button onclick="checkGuess()">Check Guess</button>

        <p id="result"></p>
    </div>

    <script>
        let randomNumber = Math.floor(Math.random() * 100) + 1;

        function checkGuess() {
            let guess = Number(document.getElementById("guess").value);
            let result = document.getElementById("result");

            if (guess === randomNumber) {
                result.innerHTML = "Correct! You guessed the number 🎉";
            }
            else if (guess < randomNumber) {
                result.innerHTML = "Too Low! Try again.";
            }
            else {
                result.innerHTML = "Too High! Try again.";
            }
        }
    </script>

</body>
</html>
